<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CONAS UI 시안</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root {
  /* Background */
  --canvas: #F1F0F5;
  --surface: #FFFFFF;
  --surface-2: #F7F6F9;
  --surface-3: #F3F1F6;

  /* Typography */
  --ink: #25232B;
  --ink-2: #484451;
  --sub: #898493;
  --faint: #B4AFBC;
  --line: #EAE7EF;

  /* Primary */
  --primary: #75628F;
  --primary-soft: #F0ECF5;

  /* Brand */
  --brand-a: #B698DE;
  --brand-b: #87D9AF;

  /* Status */
  --ok: #649987;
  --ok-soft: #EDF5F1;

  --warn: #B99A68;
  --warn-soft: #F8F3EA;

  --danger: #C77D87;
  --danger-soft: #FAF0F1;

  --leave: #8873A7;
  --leave-soft: #F2EEF7;

  /* 검토(보라) 상태 - 기존 JS 인라인에서 참조 */
  --rv: #8873A7;
  --rv-soft: #F2EEF7;

  /* Chat */
  --chat-bg: #F0EEF3;

  /* Shape */
  --r: 15px;

  /* Animation */
  --spring: cubic-bezier(.22, 1, .36, 1);

  /* Font */
  --font: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
  --num: var(--font);

  /* Shadow */
  --shadow-sm: 0 2px 8px rgba(42, 35, 55, .045);
  --shadow-md: 0 5px 18px rgba(42, 35, 55, .065);
  --shadow-lg: 0 10px 30px rgba(42, 35, 55, .08);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;display:flex;justify-content:center;align-items:center;letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
svg{flex:none}

/* ---------- 앱 틀 ---------- */
.app{position:relative;width:100%;max-width:420px;margin-inline:auto;height:100dvh;background:var(--surface-2);display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){.app{height:min(880px,calc(100dvh - 48px));border-radius:36px;box-shadow:0 30px 80px rgba(25,31,40,.18),0 0 0 1px rgba(25,31,40,.06)}}

.top{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.logo-mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--brand-a),var(--brand-b));color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
.logo small{font-size:10px;font-weight:800;color:var(--primary);letter-spacing:.08em;background:var(--primary-soft);padding:3px 7px;border-radius:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--surface-2)}
.badge{position:absolute;top:5px;right:4px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface)}

main{flex:1;overflow-y:auto;padding:16px 16px 28px}
main.chat{padding:0;overflow:hidden;display:flex;flex-direction:column;background:var(--chat-bg)}

/* 하단바: 홈 = 위가 둥근 바 / 하위 화면 = 떠 있는 알약 + 동그란 뒤로가기 */
.nav{flex:none;position:relative;z-index:6;display:flex;align-items:center;gap:2px;background:var(--surface);
  margin:0;padding:10px 8px calc(10px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;
  box-shadow:0 -6px 24px rgba(25,31,40,.07);
  transition:margin .5s var(--spring),border-radius .5s var(--spring),padding .5s var(--spring),box-shadow .4s}
.nav.sub{margin:0 12px calc(12px + env(safe-area-inset-bottom));padding:8px;border-radius:40px;
  box-shadow:0 12px 32px rgba(25,31,40,.16),0 0 0 1px rgba(25,31,40,.04)}
.nav-item{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 4px;
  font-size:12px;font-weight:600;color:var(--faint);-webkit-tap-highlight-color:transparent;transition:color .25s}
.nav-item .ico{position:relative;display:grid;place-items:center;transition:transform .35s var(--spring)}
.nav-item:active .ico{transform:scale(.8)}
.nav-item.on{color:var(--ink)}
.nav-item.on .lbl{font-weight:700}
.nav-item.pop .ico{animation:navPop .55s var(--spring)}
.nav-dot{position:absolute;top:-2px;right:-5px;width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid var(--surface)}
.nav-back{flex:none;width:58px;height:58px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);
  margin-right:6px;transition:transform .3s var(--spring),background .2s;-webkit-tap-highlight-color:transparent}
.nav-back:hover{background:var(--line)}
.nav-back:active{transform:scale(.86)}
.nav.enter .nav-item{animation:navIn .55s var(--spring) both;animation-delay:calc(var(--i) * 50ms + 60ms)}
.nav.enter .nav-back{animation:backIn .55s var(--spring) both}
@keyframes navIn{from{opacity:0;transform:translateY(12px) scale(.8)}}
@keyframes backIn{from{opacity:0;transform:translateX(-28px) scale(.4) rotate(-60deg)}}
@keyframes navPop{0%{transform:scale(1)}35%{transform:scale(.74)}70%{transform:scale(1.14)}100%{transform:scale(1)}}
/* 시안 단계라 OS의 '애니메이션 끄기' 설정과 상관없이 항상 움직이게 둬요.
   실제 서비스에서는 prefers-reduced-motion 일 때 움직임을 줄이는 걸 권장해요. */


/* ---------- 공통 ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:18px;margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-h h3{font-size:16px;font-weight:700}
.more{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:2px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;margin:4px 2px 14px}
.page-h h2{font-size:22px;font-weight:800;letter-spacing:-.03em}
.page-h p{font-size:13px;color:var(--sub);margin-top:2px}
.muted{color:var(--sub)}
.row{display:flex;align-items:center;gap:12px}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);width:100%}
.list-item:first-child{border-top:0;padding-top:2px}
.list-item .grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t15{font-size:15px;font-weight:600}
.t13{font-size:13px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2);flex:none}
.tag.primary{background:var(--primary-soft);color:var(--primary)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.st{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:700;flex:none}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.late,.st.wait{background:var(--warn-soft);color:var(--warn)}
.st.leave{background:var(--leave-soft);color:var(--leave)}
.st.no{background:var(--danger-soft);color:var(--danger)}
.st.off{background:var(--surface-2);color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.chips::-webkit-scrollbar{display:none}
.chip{height:34px;padding:0 14px;border-radius:12px;background:var(--surface);font-size:14px;font-weight:600;color:var(--ink-2);flex:none;border:1px solid var(--line)}
.chip.on{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-soft)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{height:28px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{height:52px;border-radius:14px;background:var(--primary);color:#fff;font-size:16px;font-weight:700;width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn:active{transform:scale(.98)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700;color:#fff;flex:none;position:relative}
.avatar.on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:22px 0}

/* ---------- 홈 ---------- */
.qr-card{display:flex;align-items:center;gap:14px;width:100%;padding:18px;border-radius:var(--r);margin-bottom:12px;color:#fff;background:linear-gradient(135deg,var(--brand-b) 0%,var(--brand-a) 100%);box-shadow:0 10px 24px rgba(117,98,143,.25)}
.qr-card.working{background:linear-gradient(135deg,var(--brand-b) 0%,var(--brand-a) 100%);box-shadow:0 10px 24px rgba(117,98,143,.25)}
.qr-card.done{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.qr-ic{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.qr-card.done .qr-ic{background:var(--surface-2)}
.qr-txt{flex:1}
.qr-txt b{display:block;font-size:18px;font-weight:800}
.qr-txt span{font-size:13px;opacity:.85}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px}
.week button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-radius:12px;font-size:12px;color:var(--sub);position:relative}
.week button b{font-size:16px;color:var(--ink);font-weight:700}
.week button.sun b{color:var(--danger)} .week button.sat b{color:var(--primary)}
.week button.on{background:var(--primary-soft);color:var(--primary)}
.week button.on b{color:var(--primary)}
.week button.today::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--primary);position:absolute;bottom:3px}
.week button.on.today::after{background:var(--primary)}
.ev{display:flex;gap:12px;padding:10px 0;align-items:stretch}
.ev-time{width:44px;font-size:13px;font-weight:700;color:var(--ink-2);padding-top:2px}
.ev-bar{width:3px;border-radius:2px}
.ev-body b{display:block;font-size:15px;font-weight:600}
.ev-body span{font-size:13px;color:var(--sub)}
.day-label{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:4px}

/* ---------- 근태 ---------- */
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-nav b{font-size:16px;font-weight:700;min-width:96px;text-align:center}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:12px;color:var(--sub);padding:4px 0 8px;font-weight:600}
.cal-cell{height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:14px;font-weight:600}
.cal-cell .dot{width:6px;height:6px;border-radius:50%}
.cal-cell.empty-cell{pointer-events:none}
.cal-cell.sun{color:var(--danger)} .cal-cell.sat{color:var(--primary)}
.cal-cell.future{color:var(--faint)}
.cal-cell.today span{background:var(--ink);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;margin-top:-4px}
.cal-cell.sel{background:var(--primary-soft)}
.dot.ok{background:var(--ok)} .dot.late{background:var(--warn)} .dot.leave{background:var(--leave)} .dot.no{background:var(--danger)} .dot.none{background:transparent}
.legend{display:flex;gap:12px;font-size:12px;color:var(--sub);margin-top:12px;justify-content:center}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:block}
.cal-detail{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--surface-3);display:flex;align-items:center;justify-content:space-between;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border-radius:16px;padding:14px}
.stat span{font-size:12px;color:var(--sub);font-weight:600}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.03em}
.stat b small{font-size:13px;font-weight:600;color:var(--sub);margin-left:1px}
.wk-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.wk-row:first-child{border-top:0}
.wk-date{width:46px;text-align:center}
.wk-date b{display:block;font-size:18px;font-weight:800}
.wk-date span{font-size:12px;color:var(--sub)}
.wk-time{flex:1;font-size:14px;color:var(--ink-2)}
.wk-time small{display:block;color:var(--sub);font-size:12px;margin-top:2px}

/* ---------- 서류 ---------- */
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.doc-tile{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:112px}
.doc-tile:active{transform:scale(.98)}
.doc-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.doc-tile b{font-size:15px;font-weight:700}
.doc-tile span{font-size:12px;color:var(--sub);margin-top:-6px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);font-size:15px;outline:none}
.field textarea{height:96px;padding:12px 14px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.field input[type=file]{padding:12px 14px;height:auto;font-size:13px}
.approval-line{display:flex;align-items:center;gap:6px;padding:14px;background:var(--surface-3);border-radius:12px;margin-bottom:16px;flex-wrap:wrap;font-size:13px}
.approval-line .who{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600}
.approval-line .who small{color:var(--sub);font-weight:500;font-size:11px}
.approval-line .arrow{color:var(--faint)}
.timeline{position:relative;padding-left:26px;margin:6px 0 4px}
.tl{position:relative;padding-bottom:20px}
.tl:last-child{padding-bottom:0}
.tl::before{content:"";position:absolute;left:-19px;top:20px;bottom:-2px;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.tl.done i{background:var(--ok);border-color:var(--ok)}
.tl.now i{border-color:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.tl.rej i{background:var(--danger);border-color:var(--danger)}
.tl b{font-size:15px;font-weight:600}
.tl p{font-size:13px;color:var(--sub);margin-top:2px}

/* ---------- 내 정보 ---------- */
.profile{display:flex;align-items:center;gap:14px}
.profile .avatar{width:58px;height:58px;font-size:22px}
.profile b{font-size:19px;font-weight:800}
.profile p{font-size:14px;color:var(--sub);margin-top:2px}
.menu-row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border-top:1px solid var(--line);font-size:15px;font-weight:600}
.menu-row:first-child{border-top:0;padding-top:4px}
.menu-row .grow{flex:1}
.pay-big{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 4px}
.pay-sec{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.pay-sec h4{font-size:13px;color:var(--sub);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between}
.pay-line{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--ink-2)}
.pay-line b{font-weight:600;color:var(--ink)}
.pay-line.minus b{color:var(--danger)}
.kv{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.kv:first-child{border-top:0}
.kv span{color:var(--sub)}
.kv b{font-weight:600}

/* ---------- 커뮤니티 ---------- */
.post{display:block;width:100%;padding:16px 0;border-top:1px solid var(--line)}
.post:first-child{border-top:0;padding-top:4px}
.post h4{font-size:15px;font-weight:700;margin:6px 0 4px}
.post p{font-size:14px;color:var(--ink-2);line-height:1.45}
.meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-top:8px}
.meta .lk{display:flex;align-items:center;gap:3px}
.meta .lk.hot{color:var(--danger)}
.fab{position:absolute;right:20px;bottom:106px;height:50px;padding:0 20px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 10px 24px rgba(25,31,40,.25);z-index:5}
.chan-ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.comment{padding:12px 0;border-top:1px solid var(--line)}
.comment b{font-size:13px}
.comment p{font-size:14px;margin-top:3px;color:var(--ink-2)}
.like-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:12px;border:1px solid var(--line);font-size:14px;font-weight:600;margin:14px 0}
.like-btn.on{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}

/* 채팅 */
.chat-h{height:56px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px 0 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.chat-h b{font-size:16px;font-weight:700;display:block}
.chat-h small{font-size:12px;color:var(--sub)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;max-width:86%}
.msg .avatar{width:34px;height:34px;font-size:13px}
.msg .name{font-size:12px;color:var(--ink-2);font-weight:600;margin-bottom:4px}
.bubble-row{display:flex;align-items:flex-end;gap:5px}
.bubble{background:#fff;padding:9px 13px;border-radius:4px 16px 16px 16px;font-size:15px;line-height:1.4;word-break:break-word}
.msg .time{font-size:11px;color:var(--sub);flex:none}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble-row{flex-direction:row-reverse}
.msg.me .bubble{background:var(--primary);color:#fff;border-radius:16px 4px 16px 16px}
.day-div{align-self:center;font-size:12px;color:var(--sub);background:rgba(255,255,255,.6);padding:4px 12px;border-radius:12px}
.composer{flex:none;display:flex;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.composer input{flex:1;height:44px;border-radius:22px;border:0;background:var(--surface-2);padding:0 16px;font-size:15px;outline:none}
.composer button{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center}

/* 전체 메뉴 */
.all-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.all-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0;border-radius:14px;font-size:13px;font-weight:600}
.all-grid button:hover{background:var(--surface-2)}
.all-grid .ai{width:46px;height:46px;border-radius:14px;display:grid;place-items:center}

/* ---------- 헤더 프로필 ---------- */
.hdr-av{width:40px;height:40px;display:grid;place-items:center;border-radius:12px}
.hdr-av:hover{background:var(--surface-2)}
.hdr-av .avatar{width:30px;height:30px;font-size:12px}

/* ---------- 업무 ---------- */
.st.pri{background:var(--primary-soft);color:var(--primary)}
.today-task{display:flex;align-items:center;gap:12px;width:100%}
.today-task .grow{flex:1;min-width:0;text-align:left}
.grp{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--sub);margin:14px 0 2px}
.grp span{font-size:11px;background:var(--surface-2);border-radius:8px;padding:1px 7px}
.card-h + .grp{margin-top:0}
.task{display:flex;align-items:center;gap:12px;padding:10px 0}
.task-main{min-width:0;flex:1;text-align:left}
.task-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:4px}
.tchk{width:24px;height:24px;border-radius:50%;border:2px solid #D9D5E3;display:grid;place-items:center;color:transparent;flex:none;transition:transform .3s var(--spring),background .2s,border-color .2s}
.tchk:hover{border-color:var(--ok)}
.tchk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tchk:active{transform:scale(.8)}
.task.done .t15{color:var(--faint);text-decoration:line-through}
.tchk.rv{border-color:var(--leave);color:var(--leave);background:var(--leave-soft)}
.st.rv{background:var(--leave-soft);color:var(--leave)}
.review-card{box-shadow:inset 0 0 0 1.5px var(--leave-soft)}
.admin-box{margin-top:20px;padding:16px;border-radius:16px;background:var(--surface-3);border:1px dashed #D9D5E3}
.admin-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--leave);margin-bottom:14px}
.add-hint{margin:-4px 2px 14px;font-size:13px;color:var(--primary);line-height:1.5}
.desc-box{margin:12px 0 4px;padding:14px;border-radius:12px;background:var(--surface-3);font-size:14px;line-height:1.6;color:var(--ink-2)}
.reject-box{margin-top:12px;padding:14px;border-radius:12px;background:var(--danger-soft)}
.reject-box b{font-size:13px;color:var(--danger)}
.reject-box p{font-size:14px;color:var(--ink-2);margin-top:4px;line-height:1.5}
.done-toggle{width:100%;margin-top:10px;padding:11px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--sub);text-align:center}
.proj{display:block;width:100%;padding:16px;border-radius:16px;background:var(--surface-3);text-align:left}
.proj + .proj{margin-top:8px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .6s var(--spring)}
.avs{display:flex}
.avs .avatar{width:26px;height:26px;font-size:11px;border:2px solid var(--surface-3);margin-left:-7px}
.avs .avatar:first-child{margin-left:0}
.stepper{display:flex;margin:8px 0 18px}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:var(--faint);position:relative;font-weight:600}
.step i{width:14px;height:14px;border-radius:50%;background:var(--line);z-index:1}
.step::before{content:"";position:absolute;top:6px;left:-50%;right:50%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step.done i,.step.done::before,.step.now::before{background:var(--primary)}
.step.done{color:var(--ink-2)}
.step.now{color:var(--primary)}
.step.now i{background:var(--surface);border:3px solid var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}

/* ---------- 공지 · 조직 ---------- */
.post.unread h4::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--danger);margin-right:7px;vertical-align:middle;position:relative;top:-1px}
.confirm-box{margin-top:22px;padding:14px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-size:14px;font-weight:700;display:block}
.confirm-box svg{vertical-align:-3px}
.confirm-box p{color:var(--ink-2);font-weight:500;font-size:13px;margin-top:6px}
.demo-switch{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.org-top{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--primary-soft);width:100%;text-align:left}
.org-tree{position:relative;padding-left:18px}
.org-tree::before{content:"";position:absolute;left:7px;top:0;bottom:28px;width:2px;background:var(--line)}
.org-team{position:relative;margin-top:10px;padding:6px 14px 4px;border-radius:16px;background:var(--surface-3)}
.org-tree .org-team::before{content:"";position:absolute;left:-11px;top:22px;width:11px;height:2px;background:var(--line)}
.org-team .list-item{text-align:left}
.search{display:flex;align-items:center;gap:8px;height:50px;padding:0 8px 0 14px;border-radius:14px;background:var(--surface);margin-bottom:12px;color:var(--sub);border:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.search input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:15px;color:var(--ink)}
.search-x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.search-x[hidden]{display:none}
.person-h{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 0 18px;text-align:center}
.person-h .avatar{width:72px;height:72px;font-size:28px;margin-bottom:6px}
.person-h .avatar.on::after{width:16px;height:16px;border-width:3px}
.person-h b{font-size:20px;font-weight:800}
.person-h p{font-size:14px;color:var(--sub)}
.new-dm{display:flex;align-items:center;gap:5px;height:36px;padding:0 14px;border-radius:12px;background:var(--surface);font-size:13px;font-weight:700;border:1px solid var(--line)}
.org-team-h{display:flex;justify-content:space-between;font-weight:700;padding:8px 0 4px}
.org-team .list-item:first-of-type{border-top:1px solid var(--line);padding-top:12px}
.rule-box{margin-top:14px;font-size:13px;color:var(--ink-2);line-height:1.9}
.rule-box b{display:inline-block;width:72px;color:var(--sub)}

/* ---------- 시트 / 토스트 ---------- */
.sheet-wrap{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet-wrap[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(15,18,24,.45);animation:fade .2s}
.sheet{position:relative;background:var(--surface);border-radius:24px 24px 0 0;max-height:88%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.7,.2,1)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px 20px;flex:none}
.sheet-head b{font-size:18px;font-weight:800}
.sheet-body{overflow-y:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:50%;top:68px;transform:translateX(-50%);background:rgba(25,31,40,.92);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;z-index:30;white-space:nowrap;animation:fade .2s}
.qr-box{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 18px}
.qr-frame{padding:14px;border-radius:20px;border:1px solid var(--line)}
.qr-timer{font-size:13px;color:var(--sub)}
.qr-timer b{color:var(--primary)}
.noti{display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.noti:first-child{border-top:0}
.noti.unread{position:relative}
.noti.unread::after{content:"";position:absolute;right:0;top:20px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.noti b{font-size:14px;font-weight:600;display:block;padding-right:14px}
.noti p{font-size:13px;color:var(--sub);margin-top:2px}

/* ================= 디자인 레이어 (라벤더 톤 · 크기/배치는 기존 유지) ================= */
.app{isolation:isolate}
.stat b,.pay-big,.week button b,.cal-cell,.wk-date b,.ev-time,.msg .time,.badge,.count,.st, .qr-timer b,.pay-line b,.cal-nav b,.pay-sec h4 span:last-child,.tag{font-family:var(--num);font-variant-numeric:tabular-nums}
.top{position:relative;z-index:3}
.logo{gap:7px;font-family:var(--num);font-size:19px}
.cn-mark{width:30px;height:30px;display:block;flex:none}
.logo small{font-family:var(--num);font-size:10px;letter-spacing:.12em;padding:3px 8px;border-radius:7px;margin-left:2px}
.nav-item .ico{transition:transform .35s var(--spring),background .25s}
.page-h{margin-top:8px}
.page-h h2::before{display:block;width:max-content;font:900 11px/1 var(--num);letter-spacing:.16em;margin-bottom:9px;color:var(--primary)}
.app[data-tab="task"] .page-h h2::before{content:"WORKSPACE · TASKS"}
.app[data-tab="att"] .page-h h2::before{content:"WORKSPACE · ATTENDANCE"}
.app[data-tab="doc"] .page-h h2::before{content:"WORKSPACE · DOCUMENTS"}
.app[data-tab="notice"] .page-h h2::before{content:"WORKSPACE · NOTICE"}
.app[data-tab="board"] .page-h h2::before{content:"COMMUNITY · BOARD"}
.app[data-tab="chan"] .page-h h2::before{content:"COMMUNITY · CHANNELS"}
.app[data-tab="people"] .page-h h2::before{content:"COMMUNITY · PEOPLE"}
.app[data-tab="dm"] .page-h h2::before{content:"MESSAGES"}
.page-h h2{font-size:25px;letter-spacing:-.035em}

/* 카드류: 진한 테두리 대신 은은한 그림자 (테두리 두께는 투명으로 유지해 크기 불변) */
.card,.stat,.doc-tile{background:var(--surface);border:1px solid transparent;box-shadow:var(--shadow-sm)}
.search{box-shadow:var(--shadow-sm)}
.card{padding:20px}
.stat{border-radius:var(--r)}
.card-h h3{font-size:17px;font-weight:800;letter-spacing:-.02em}
.stat b{font-weight:700;font-size:24px}
.review-card{box-shadow:var(--shadow-sm),inset 0 0 0 1.5px var(--leave-soft)}
.sheet .stat{background:var(--surface-3);box-shadow:none}
.cal-detail,.approval-line,.desc-box,.org-team,.proj,.done-toggle{background:var(--surface-3);border:1px solid transparent}
.admin-box{background:var(--surface-3);border:1px dashed #D9D5E3}
.btn{transition:transform .2s var(--spring),background .2s}
.btn,.fab,.composer button{border:1px solid transparent}
.composer button svg{width:28px;height:28px}
.bubble{border:1px solid transparent}
.day-div{border:1px solid transparent}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#DDD9E5;margin:10px auto 0;flex:none}

/* 출근 카드 */
.qr-card{position:relative;overflow:hidden;gap:16px;padding:20px 18px;border:1px solid transparent;background-origin:border-box}
.qr-ic{position:relative;z-index:1;width:48px;height:52px;background:none;border-radius:0;box-shadow:none;color:#fff}
.qr-ic svg{width:44px;height:44px}
.qr-card.done .qr-ic{background:none;color:var(--ink-2)}
.qr-txt{position:relative;z-index:1}
.qr-txt b{font-size:19px;letter-spacing:-.025em;margin-bottom:3px}
.qr-txt b::before{content:"CHECK-IN";display:block;font:900 10.5px/1 var(--num);letter-spacing:.16em;margin-bottom:7px;color:rgba(255,255,255,.78)}
.qr-card.working .qr-txt b::before{content:"CHECK-OUT"}
.qr-card.done .qr-txt b::before{content:"TODAY";color:var(--sub)}
.qr-txt span{font-size:13.5px;opacity:1;color:rgba(255,255,255,.88)}
.qr-card.done .qr-txt span{color:var(--sub)}
.qr-card > svg{position:relative;z-index:1;color:rgba(255,255,255,.8)}
.qr-card.done > svg{color:var(--ink-2)}

/* 전체 메뉴 타일 */
.dash{padding:20px 16px 16px}
.dash .card-h{margin:0 4px 14px}
.dash .card-h h3{font-size:18px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:12px;height:60px;padding:0 14px 0 11px;border-radius:var(--r);font-size:15px;font-weight:600;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);-webkit-tap-highlight-color:transparent;transition:transform .3s var(--spring),background .2s,border-color .2s}
.tile .ti{display:grid;place-items:center;flex:none}
.tile:active{transform:scale(.96);background:var(--surface-2)}
@media (hover:hover){.tile:hover{background:var(--surface-2)}}
@media(max-width:350px){.tile{font-size:14px;gap:9px;padding:0 10px}.tile .ti{width:34px;height:34px}}
.tile .ti{width:30px;height:30px;background:none;border-radius:0;color:var(--ink)}
.tile.danger .ti{color:var(--danger)}

/* 서류 타일 (아이콘 주변 박스 없음) */
.doc-grid{grid-template-columns:1fr;gap:8px}
.doc-tile{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;row-gap:3px;align-items:center;min-height:66px;padding:12px 18px 12px 16px;border-radius:var(--r);transition:transform .2s ease,background .2s}
.doc-tile:active{transform:scale(.985);background:var(--surface-2)}
@media (hover:hover){.doc-tile:hover{background:var(--surface-2)}}
.doc-tile .doc-ic{grid-row:1/3;width:30px;height:30px;background:none!important;color:var(--primary)!important;border-radius:0}
.doc-tile .doc-ic svg{width:25.2px;height:25.2px;stroke-width:2.3}
.doc-tile b{grid-column:2;font-size:15px;color:var(--ink)}
.doc-tile span:not(.doc-ic){grid-column:2;margin-top:0;font-size:12.5px}
#view .doc-ic{width:32px;height:32px;background:none!important;color:var(--primary)!important;border-radius:0}
#view .doc-ic svg{width:25.2px;height:25.2px;stroke-width:2.2}
#view .today-task .doc-ic{width:40px;height:40px}
#view .today-task .doc-ic svg{width:31px;height:31px}

/* 캘린더 · 주간: 선택=단색 연보라 배경, 오늘=기준 HTML과 동일 */
.cal-cell{gap:4px}
.cal-cell span{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;margin-top:0;transition:background .2s;position:relative}
.cal-cell.today span{width:32px;height:32px;margin-top:0}

/* 하단바: 선택 = 단색 연보라 배경 + 아이콘 색 변화 (모서리 형태는 선택 전/후 동일) */
.nav-item{gap:4px;padding:4px 0 2px}
.nav-item .ico{width:58px;height:38px;border-radius:14px}
.nav-item .ico svg{width:29px;height:29px}
.nav-item .lbl{font-size:11.5px;line-height:1}
.nav-dot{top:3px;right:11px}
.nav-item.on .ico{background:var(--primary-soft);color:var(--primary);--cut:var(--primary-soft)}

/* 타이포그래피 */
body{letter-spacing:-.02em}
.logo{letter-spacing:-.01em}
h2,h3,h4,b,strong,.t15,.btn,.fab,.chip.on,.nav-item.on .lbl,.st,.tag,.tile,.doc-tile b,.qr-txt b,.stat b,.seg button.on,.new-dm,.logo{font-weight:800}
.avatar{color:var(--ink)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* 눌림/전환 모션 */
.list-item,.post,.qr-card,.profile,.chip,.seg button,.icon-btn,.hdr-av,.new-dm,.proj,.chan-row,.dm-row,.person{transition:transform .22s var(--spring),background-color .2s,filter .2s}
.list-item:active,.post:active,.profile:active,.proj:active,.chan-row:active,.dm-row:active,.person:active{transform:scale(.98)}
.qr-card:active{transform:scale(.975)}
.chip:active,.seg button:active,.icon-btn:active,.hdr-av:active,.new-dm:active{transform:scale(.93)}
.list-item:active,.post:active{background-color:rgba(240,236,245,.6)}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#view.enter > *{animation:viewIn .38s cubic-bezier(.2,.8,.2,1) both}
#view.enter > *:nth-child(2){animation-delay:.04s}
#view.enter > *:nth-child(3){animation-delay:.08s}
#view.enter > *:nth-child(4){animation-delay:.12s}
#view.enter > *:nth-child(5){animation-delay:.16s}
#view.enter > *:nth-child(n+6){animation-delay:.2s}
@media (prefers-reduced-motion:reduce){#view.enter > *{animation:none}}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 0 22px;font-weight:700;color:var(--sub)}
.empty::before{content:"";width:64px;height:64px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%20fill%3D%22none%22%20stroke%3D%22%2375628F%22%20stroke-width%3D%222.4%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2230%22%20fill%3D%22%23F0ECF5%22%20stroke%3D%22none%22%2F%3E%3Cpath%20d%3D%22M19.5%2033.5v7.2a3.3%203.3%200%200%200%203.3%203.3h18.4a3.3%203.3%200%200%200%203.3-3.3v-7.2l-4.6-9.3a3%203%200%200%200-2.7-1.7H28%22%2F%3E%3Cpath%20d%3D%22M19.5%2033.5h7l2%203.5h7l2-3.5h7%22%2F%3E%3Cpath%20d%3D%22M23%2020.5l1.2%202.4M18.5%2025.5l2.3%201.1%22%20stroke%3D%22%23A99AC2%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}


/* ---------- 사용자 요청: 선택 박스 라운드 및 타이포 굵기 미세 조정 ---------- */
/* 흰색 바탕의 입력·선택 UI 모서리만 18px로 통일 (크기와 배치는 유지) */
.field input,
.field select,
.field textarea,
.search,
.tile,
.doc-tile,
.chip,
.new-dm {
  border-radius: 18px;
}

/* 기존의 과하게 두꺼운 굵기만 한 단계 낮춤 */
h2, h3, h4, b, strong,
.t15, .btn, .fab, .chip.on, .nav-item.on .lbl,
.st, .tag, .tile, .doc-tile b, .qr-txt b,
.stat b, .seg button.on, .new-dm, .logo {
  font-weight: 600;
}

/* 일반 UI 라벨도 조금 더 가볍게 */
.field label,
.nav-item,
.menu-row,
.grp,
.step,
.admin-h {
  font-weight: 500;
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
  <div id="fab"></div>
  <nav class="nav" id="nav"></nav>
  <div class="sheet-wrap" id="sheet" hidden>
    <div class="backdrop" onclick="closeSheet()"></div>
    <div class="sheet">
      <div class="sheet-head"><b id="sheetTitle"></b><button class="icon-btn" onclick="closeSheet()" aria-label="닫기"></button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>
</div>

<script>
/* ================= 아이콘 =================
   단순한 도형으로 만든 둥근 아이콘 한 벌.
   평소에는 선(ICONS), 하단바에서 선택되면 채운 모양(FILLED).
   채운 모양 안의 선은 선택 알약 색(--cut)으로 그려 구멍처럼 보여요 */
const ICONS = {
  home:'<path d="M4 10.3 12 4l8 6.3V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5H9v5.5H5.5A1.5 1.5 0 0 1 4 19z"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19.5a6 6 0 0 1 12 0"/><circle cx="16.5" cy="9" r="2.6"/><path d="M16 14.2a5 5 0 0 1 5 5.3"/>',
  message:'<path d="M5 4.5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-7l-4.5 3.5v-3.5H5a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-width="2.6"/>',
  grid:'<rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/>',

function attOf(d){
  const wd = d.getDay();
  if (wd===0 || wd===6) return null;
  if (d > TODAY) return null;
  if (d.getTime()===TODAY.getTime()) return S.checkIn ? {s:'ok', in:S.checkIn, out:S.checkOut} : {s:'wait'};
  const n = d.getDate() + d.getMonth()*31;
  if (n%13===4) return {s:'leave'};
  if (n%17===9) return {s:'no'};
  if (n%9===2) return {s:'late', in:'09:0'+(n%7+2), out:'18:1'+(n%6)};
  return {s:'ok', in:'08:'+(40+n%18), out:'18:0'+(n%9)};
}

function roleHint(f, id){
  const m = mem(id), h = $('#roleHint');
  const prev = f.role.value==='팀장' ? teamLead(f.team.value, id) : null;
  if (prev) h.innerHTML = `<span style="color:var(--warn)">기존 팀장 ${prev.name}님은 팀원으로 바뀌어요. 팀장은 팀에 한 명이에요.</span>`;
  else if (m.role==='팀장' && (f.role.value==='팀원' || f.team.value!==m.team)) h.innerHTML = `<span style="color:var(--warn)">${TEAMS[m.team]}에 팀장이 없어져요. 결재와 검토는 대표에게 바로 가요.</span>`;

function saveMember(e, id){
  e.preventDefault();
  const m = mem(id), f = new FormData(e.target);
  const next = {team:f.get('team'), role:f.get('role'), pos:f.get('pos')};
  if (next.team===m.team && next.role===m.role && next.pos===m.pos){ toast('바뀐 내용이 없어요'); return; }
  const prev = next.role==='팀장' ? teamLead(next.team, id) : null;
  if (prev) prev.role = '팀원';
  Object.assign(m, next);
  // DM 목록에 보이는 직함도 맞춰줘요
  DMS.forEach(d=>{ const x = mem(d.id); if (x) d.role = roleLabel(x); });
  NOTI.unshift({ic:'user', c:'var(--leave)', title:'인사 정보가 변경됐어요', body:`${m.name} · ${roleLabel(m)}${prev?` / ${prev.name} · 팀원`:''}`, time:'방금', unread:true});
  render(); openPerson(id);
  toast(`${m.name}님을 ${roleLabel(m)}(으)로 바꿨어요`);
}

/* ================= WS: 업무 ================= */
const ddayLabel = n => n<0 ? `D+${-n}` : n===0 ? 'D-Day' : `D-${n}`;
const ddayCls = (n, done) => done ? 'off' : n<0 ? 'no' : n===0 ? 'late' : n<=3 ? 'pri' : 'off';
function projStat(p){
  const ts = TASKS.filter(t=>t.p===p.id), doneN = ts.filter(t=>t.done).length;
  const pct = ts.length ? Math.round(doneN/ts.length*100) : 0;
  const late = ts.some(t=>!t.done && t.due<0);
  const st = late ? ['no','지연','var(--danger)'] : (p.due<=14 && pct<50) ? ['late','주의','var(--warn)'] : ['ok','순조','var(--ok)'];
  const people = [...new Set(ts.map(t=>t.to))].map(mem);
  return {ts, doneN, pct, st, people, lateN:ts.filter(t=>!t.done&&t.due<0).length};
}
function taskRow(t){
  const p = PROJECTS.find(x=>x.id===t.p), who = mem(t.to), by = mem(t.by);
  const sub = t.to!==ME.id ? `${who.name} 담당` : by.id===ME.id ? '직접 등록' : `${by.name} ${by.role} 배정`;
  const s = taskState(t);
  return `<div class="task ${s==='done'?'done':''}">
    <button class="tchk ${s==='done'?'on':s==='review'?'rv':''}" onclick="openTask(${t.id})" aria-label="업무 상세">${s==='review'?ic('clock',14,2.6):ic('check',14,3)}</button>
    <button class="grow task-main" onclick="openTask(${t.id})">
      <span class="t15 ellipsis" style="display:block">${esc(t.title)}</span>
      <span class="task-meta"><span class="tag">${p?p.short:'개인'}</span>${t.reject&&s==='todo'?'<span class="tag danger">반려됨</span>':''}${sub}</span>
    </button>
    ${stateChip(t)}
  </div>`;
}
function vTask(){
  const leader = ME.role!=='팀원';
  const view = leader ? S.taskView : 'mine';
  const vis = visibleProjects().map(p=>p.id);
  const pool = TASKS.filter(t => view==='mine' ? t.to===ME.id : vis.includes(t.p));
  const open = pool.filter(t=>!t.done), done = pool.filter(t=>t.done);
  const active = open.filter(t=>!t.review);
  // 내가 검토해야 할 업무 (팀장·대표)
  const reviewQ = TASKS.filter(t=>t.review && canReview(t) && vis.includes(t.p)).sort((a,b)=>a.due-b.due);
  const waiting = open.filter(t=>t.review && !reviewQ.includes(t));
  const endWeek = 6 - TODAY.getDay();
  const groups = [['지연',t=>t.due<0],['오늘',t=>t.due===0],['이번 주',t=>t.due>0&&t.due<=endWeek],['나중에',t=>t.due>endWeek]];
  const cnt = i => active.filter(groups[i][1]).length;
  const list = groups.map(([g,f])=>{ const l = active.filter(f).sort((a,b)=>a.due-b.due);
    return l.length ? `<div class="grp">${g}<span>${l.length}</span></div>${l.map(taskRow).join('')}` : ''; }).join('')
    + (waiting.length ? `<div class="grp">검토 기다리는 중<span>${waiting.length}</span></div>${waiting.map(taskRow).join('')}` : '');
  const reviewCard = reviewQ.length ? `
  <section class="card review-card">
    <div class="card-h"><h3>검토 요청 <span style="color:var(--rv)">${reviewQ.length}</span></h3><span class="t13 muted">확정하거나 반려해 주세요</span></div>
    ${reviewQ.map(taskRow).join('')}
  </section>` : '';
  const projs = visibleProjects();
  return `
  <div class="page-h"><div><h2>업무</h2><p>${ME.role==='대표'?'전체 프로젝트':ME.dept+' 프로젝트'}</p></div>
    ${leader?`<div class="seg"><button class="${view==='mine'?'on':''}" onclick="S.taskView='mine';render()">내 업무</button><button class="${view==='team'?'on':''}" onclick="S.taskView='team';render()">${ME.role==='대표'?'전체':'팀 전체'}</button></div>`:''}
  </div>
  <div class="stats">
    <div class="stat"><span>지연</span><b style="color:${cnt(0)?'var(--danger)':'inherit'}">${cnt(0)}<small>건</small></b></div>
    <div class="stat"><span>오늘 마감</span><b style="color:${cnt(1)?'var(--warn)':'inherit'}">${cnt(1)}<small>건</small></b></div>
    <div class="stat"><span>이번 주</span><b>${cnt(2)}<small>건</small></b></div>
  </div>
  ${reviewCard}
  <section class="card">
    <div class="card-h"><h3>${view==='mine'?'내 할 일':'팀 업무'}</h3><span class="t13 muted">남은 ${open.length}건</span></div>
    ${list || '<div class="empty">남은 업무가 없어요 🎉</div>'}
    ${done.length?`<button class="done-toggle" onclick="S.showDone=!S.showDone;render()">완료한 업무 ${done.length}건 ${S.showDone?'접기':'보기'}</button>${S.showDone?done.map(taskRow).join(''):''}`:''}
  </section>
  <section class="card">
    <div class="card-h"><h3>프로젝트 진행 현황</h3><span class="t13 muted">${projs.length}개</span></div>
    ${projs.map(p=>{ const s = projStat(p); return `
      <button class="proj" onclick="openProject('${p.id}')">
        <div class="row" style="justify-content:space-between"><b class="t15">${p.name}</b><span class="st ${s.st[0]}">${s.st[1]}</span></div>
        <p class="t13 muted" style="margin:4px 0 12px">${STAGES[p.stage]} 단계 · 마감 ${ddayLabel(p.due)}</p>
        <div class="bar"><i style="width:${s.pct}%;background:${s.st[2]}"></i></div>
        <div class="row" style="justify-content:space-between;margin-top:10px">
          <span class="t13"><b>${s.pct}%</b> <span class="muted">· 업무 ${s.doneN}/${s.ts.length}</span></span>
          <span class="avs">${s.people.map(m=>avatar(m.name)).join('')}</span>
        </div>
      </button>`; }).join('') || '<div class="empty">볼 수 있는 프로젝트가 없어요</div>'}
  </section>
  <section class="card">
    <div class="card-h"><h3>회사 전체 마감</h3></div>
    ${COMPANY_DUE.map(d=>`<div class="list-item">
      <span class="doc-ic" style="color:var(--leave);background:var(--leave-soft)">${ic('flag',18,2)}</span>
      <span class="grow"><span class="t15" style="display:block">${d.title}</span><span class="t13 muted">${md(addDays(d.due))} · ${d.desc}</span></span>
      <span class="st ${ddayCls(d.due)}">${ddayLabel(d.due)}</span></div>`).join('')}
  </section>`;

/* 업무 완료 흐름: 담당자 "완료 요청" → 배정한 사람(또는 상급자)이 "확정" / "반려"
   본인이 본인에게 등록한 업무만 바로 완료할 수 있어요 */
const taskState = t => t.done ? 'done' : t.review ? 'review' : 'todo';
// 검토자 = rv(직접 추가한 프로젝트 업무) 또는 배정한 사람
const reviewerId = t => t.rv || t.by;
const isSelfTask = t => t.to===reviewerId(t);
const canReview = t => !isSelfTask(t) && t.to!==ME.id && (reviewerId(t)===ME.id || assignable().some(m=>m.id===t.to));
function stateChip(t){
  const s = taskState(t);
  return s==='done' ? '<span class="st ok">완료</span>' : s==='review' ? '<span class="st rv">검토 중</span>' : `<span class="st ${ddayCls(t.due)}">${ddayLabel(t.due)}</span>`;
}
const findTask = id => TASKS.find(x=>x.id===id);
function openTask(id){
  const t = findTask(id), p = PROJECTS.find(x=>x.id===t.p), who = mem(t.to), by = mem(t.by), rvM = mem(reviewerId(t));
  const s = taskState(t), mine = t.to===ME.id;
  const flow = isSelfTask(t)
    ? `<div class="tl done"><i></i><b>등록 · ${by.name}</b><p>직접 등록한 업무예요</p></div>
       <div class="tl ${s==='done'?'done':'now'}"><i></i><b>${s==='done'?'완료':'진행 중'}</b><p>검토 없이 바로 완료할 수 있어요</p></div>`
    : `<div class="tl done"><i></i><b>${t.by===t.to ? '직접 추가 · '+who.name : '배정 · '+by.name+' '+by.role}</b><p>${t.by===t.to ? '프로젝트 업무라 완료할 때 확인을 받아요' : who.name+'님에게 배정'}</p></div>
       <div class="tl ${s==='todo'?'now':'done'}"><i></i><b>완료 요청 · ${who.name}</b><p>${s==='todo' ? (t.reject?'반려돼서 다시 진행 중이에요':'진행 중이에요') : esc(t.note||'메모 없이 요청했어요')}</p></div>
       <div class="tl ${s==='done'?'done':s==='review'?'now':''}"><i></i><b>검토 · ${rvM.name} ${rvM.role}</b><p>${s==='done'?'확정했어요':s==='review'?'검토를 기다리는 중이에요':'완료 요청이 오면 검토해요'}</p></div>`;
  let actions = '';
  if (isSelfTask(t) && mine)
    actions = `<button class="btn ${t.done?'ghost':''}" onclick="selfDone(${id})">${t.done?'완료 취소':ic('check',20,2.4)+'완료로 표시'}</button>`;
  else if (mine && s==='todo')
    actions = `<div class="field"><label>완료 메모 (선택)</label><textarea id="tNote" placeholder="결과물 링크나 작업 내용을 적어주세요"></textarea></div>
      <button class="btn" onclick="requestDone(${id})">${ic('send',18,2.2)}${rvM.name} ${rvM.role}님께 완료 요청</button>`;
  else if (mine && s==='review')
    actions = `<button class="btn ghost" onclick="cancelRequest(${id})">완료 요청 취소</button>`;
  else if (canReview(t) && s==='review')
    actions = `<div class="field" id="rejWrap" hidden><label>반려 사유</label><textarea id="rejNote" placeholder="무엇을 고치면 되는지 적어주세요"></textarea></div>
      <div class="row" style="gap:8px"><button class="btn ghost" style="flex:1" id="rejBtn" onclick="rejectTask(${id})">반려</button>
      <button class="btn" style="flex:2" onclick="approveTask(${id})">${ic('check',20,2.4)}확정</button></div>`;
  else if (canReview(t) && s==='done')
    actions = `<button class="btn ghost" onclick="reopenTask(${id})">확정 취소</button>`;
  openSheet('업무 상세', `
    <span class="tag primary">${p?p.name:'개인 할 일'}</span>
    <h3 style="font-size:19px;font-weight:800;margin:8px 0 14px">${esc(t.title)}</h3>
    <div class="kv"><span>담당</span><b>${who.name} · ${roleLabel(who)}</b></div>
    <div class="kv"><span>마감</span><b>${md(addDays(t.due))} <span style="margin-left:4px">${stateChip(t)}</span></b></div>
    ${t.desc?`<p class="desc-box">${esc(t.desc)}</p>`:''}
    ${t.reject && s==='todo' ? `<div class="reject-box"><b>반려 사유 · ${rvM.name}</b><p>${esc(t.reject)}</p></div>` : ''}
    <div class="timeline" style="margin-top:18px">${flow}</div>
    <div style="margin-top:20px">${actions}</div>`);
}
function selfDone(id){ const t = findTask(id); t.done = !t.done; closeSheet(); render(); if (t.done) toast('업무를 완료했어요 👏'); }
function requestDone(id){
  const t = findTask(id), by = mem(reviewerId(t));
  t.review = true; t.note = ($('#tNote').value||'').trim(); t.reject = null;
  closeSheet(); render(); toast(`${by.name} ${by.role}님께 완료를 요청했어요`);
}
function cancelRequest(id){ findTask(id).review = false; closeSheet(); render(); toast('완료 요청을 취소했어요'); }
function approveTask(id){
  const t = findTask(id); t.review = false; t.done = true; t.reject = null;
  closeSheet(); render(); toast(`${mem(t.to).name}님 업무를 확정했어요 👏`);
}
function rejectTask(id){
  const wrap = $('#rejWrap');
  if (wrap.hidden){ wrap.hidden = false; $('#rejBtn').textContent = '반려 보내기'; $('#rejNote').focus(); return; }
  const note = $('#rejNote').value.trim();
  if (!note){ toast('반려 사유를 적어주세요'); $('#rejNote').focus(); return; }
  const t = findTask(id); t.review = false; t.reject = note;
  closeSheet(); render(); toast(`${mem(t.to).name}님에게 반려했어요`);
}
function reopenTask(id){ findTask(id).done = false; closeSheet(); render(); toast('확정을 취소했어요'); }
function openProject(id){
  const p = PROJECTS.find(x=>x.id===id), s = projStat(p);
  const ts = [...s.ts].sort((a,b)=>(a.done-b.done) || a.due-b.due);
  openSheet(p.name, `
    <div class="stepper">${STAGES.map((g,i)=>`<div class="step ${i<p.stage?'done':i===p.stage?'now':''}"><i></i><span>${g}</span></div>`).join('')}</div>
    <div class="stats">
      <div class="stat" style="background:var(--surface-3)"><span>진행률</span><b>${s.pct}<small>%</small></b></div>
      <div class="stat" style="background:var(--surface-3)"><span>남은 업무</span><b>${s.ts.length-s.doneN}<small>건</small></b></div>
      <div class="stat" style="background:var(--surface-3)"><span>지연</span><b style="color:${s.lateN?'var(--danger)':'inherit'}">${s.lateN}<small>건</small></b></div>
    </div>
    <p class="t13 muted" style="margin-bottom:6px">마감 ${md(addDays(p.due))} · ${ddayLabel(p.due)} · ${TEAMS[p.team]}</p>
    ${ts.map(taskRow).join('')}`);
}
function openAssign(){
  const people = assignable(), projs = visibleProjects();
  const rv = approvers()[0];
  openSheet(people.length ? '업무 추가' : '할 일 추가', `
    <form onsubmit="submitAssign(event)" onchange="addHint(this)">
      ${people.length ? `<div class="field"><label>담당자</label><select name="to"><option value="${ME.id}">나 (내 할 일)</option>${people.map(m=>`<option value="${m.id}">${m.name} (${roleLabel(m)})</option>`).join('')}</select></div>` : ''}
      <div class="field"><label>프로젝트</label><select name="p"><option value="">개인 할 일 (프로젝트 없음)</option>${projs.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>
      <p class="add-hint" id="addHint" data-rv="${rv?rv.name+' '+rv.role:''}">개인 할 일은 검토 없이 바로 완료할 수 있어요.</p>
      <div class="field"><label>업무명</label><input name="title" required placeholder="예: 로그인 화면 개발"></div>
      <div class="field"><label>마감일</label><input type="date" name="due" value="${iso(addDays(3))}" required></div>
      <div class="field"><label>설명 (선택)</label><textarea name="desc" placeholder="무엇을, 어디까지 하면 되는지 적어주세요"></textarea></div>
      <button class="btn" type="submit" id="addBtn">추가하기</button>
    </form>`);
}
// 폼 아래 안내: 누가 완료를 확인하는지 바로 보여줘요
function addHint(form){
  const h = $('#addHint'), to = form.to ? form.to.value : ME.id, p = form.p.value;
  if (to!==ME.id){ h.textContent = `${mem(to).name}님이 완료를 요청하면 내가 확정하거나 반려해요.`; $('#addBtn').textContent = '배정하기'; return; }
  $('#addBtn').textContent = '추가하기';
  h.textContent = !p ? '개인 할 일은 검토 없이 바로 완료할 수 있어요.'
    : h.dataset.rv ? `프로젝트 업무는 완료할 때 ${h.dataset.rv}님이 확인해요.` : '대표 업무라 검토 없이 바로 완료할 수 있어요.';
}
function submitAssign(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const to = f.get('to') || ME.id, p = f.get('p') || null;
  const due = Math.round((new Date(f.get('due')+'T00:00') - TODAY) / 864e5);
  // 내 프로젝트 업무는 결재선 첫 사람(팀원 → 팀장, 팀장 → 대표)이 검토해요
  const rv = (to===ME.id && p && approvers()[0]) ? approvers()[0].id : undefined;
  TASKS.push({id:Date.now(), p, title:f.get('title'), to, by:ME.id, rv, due, done:false, desc:f.get('desc')});
  S.taskView = to===ME.id ? 'mine' : 'team';
  closeSheet(); render(); toast(to===ME.id ? '할 일을 추가했어요' : `${mem(to).name}님에게 업무를 배정했어요`);
}

/* ================= WS: 근태 ================= */
function vAtt(){
  const base = new Date(TODAY.getFullYear(), TODAY.getMonth()+S.calOff, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const dim = new Date(y, m+1, 0).getDate();
  let late=0, work=0, leave=0;
  for (let i=1;i<=dim;i++){ const a=attOf(new Date(y,m,i)); if(!a) continue; if(a.s==='late'){late++;work++} else if(a.s==='ok') work++; else if(a.s==='leave') leave++; }

  let body;
  if (S.calView==='month'){
    const off = base.getDay();
    let cells = DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
    for (let i=0;i<off;i++) cells += '<div class="cal-cell empty-cell"></div>';
    for (let i=1;i<=dim;i++){
      const d = new Date(y,m,i), a = attOf(d), wd = d.getDay();
      const cls = [wd===0?'sun':wd===6?'sat':'', d>TODAY?'future':'', d.getTime()===TODAY.getTime()?'today':'', (S.calOff===0&&i===S.calSel)||(S.calOff!==0&&i===S.calSel)?'sel':''].join(' ');
      cells += `<button class="cal-cell ${cls}" onclick="S.calSel=${i};render()"><span>${i}</span><i class="dot ${a&&a.s!=='wait'?a.s:'none'}"></i></button>`;
    }
    const sd = new Date(y,m,Math.min(S.calSel,dim)), sa = attOf(sd);
    body = `<div class="cal-grid">${cells}</div>
      <div class="legend"><span><i style="background:var(--ok)"></i>정상</span><span><i style="background:var(--warn)"></i>지각</span><span><i style="background:var(--leave)"></i>연차</span><span><i style="background:var(--danger)"></i>결근</span></div>
      <div class="cal-detail"><b>${md(sd)}</b>${sa?`<span class="row" style="gap:8px">${sa.in?`<span class="muted t13">${sa.in} – ${sa.out||'근무 중'}</span>`:''}<span class="st ${sa.s}">${ST_LABEL[sa.s]}</span></span>`:'<span class="muted t13">기록 없음</span>'}</div>`;
  } else {
    const start = new Date(TODAY); start.setDate(TODAY.getDate()-TODAY.getDay()+1 + S.calOff*7);
    body = [...Array(5)].map((_,i)=>{ const d=new Date(start); d.setDate(start.getDate()+i); const a=attOf(d);
      return `<div class="wk-row"><div class="wk-date"><b>${d.getDate()}</b><span>${DOW[d.getDay()]}</span></div>
        <div class="wk-time">${a&&a.in?`${a.in} – ${a.out||'근무 중'}<small>${a.out?'근무 '+diffH(a.in,a.out):'출근 완료'}</small>`:a&&a.s==='leave'?'종일 연차':a&&a.s==='no'?'출근 기록 없음':d>TODAY?'<span class="muted">예정</span>':'<span class="muted">출근 전</span>'}</div>
        ${a?`<span class="st ${a.s}">${ST_LABEL[a.s]}</span>`:'<span class="st off">-</span>'}</div>`; }).join('');
  }
  const title = S.calView==='month' ? `${y}년 ${m+1}월` : weekTitle();
  return `
  <div class="page-h"><div><h2>근태</h2><p>${ME.dept} · 09:00 – 18:00 근무</p></div></div>
  <div class="stats">
    <div class="stat"><span>근무일</span><b>${work}<small>일</small></b></div>
    <div class="stat"><span>지각</span><b style="color:${late?'var(--warn)':'inherit'}">${late}<small>회</small></b></div>
    <div class="stat"><span>남은 연차</span><b style="color:var(--leave)">11.5<small>일</small></b></div>
  </div>
  <section class="card">
    <div class="card-h">
      <div class="cal-nav"><button class="icon-btn" onclick="S.calOff--;render()">${ic('chevL',20)}</button><b>${title}</b><button class="icon-btn" onclick="S.calOff++;render()">${ic('chevR',20)}</button></div>
      <div class="seg"><button class="${S.calView==='month'?'on':''}" onclick="S.calView='month';S.calOff=0;render()">월간</button><button class="${S.calView==='week'?'on':''}" onclick="S.calView='week';S.calOff=0;render()">주간</button></div>
    </div>
    ${body}
  </section>
  <button class="btn ghost" onclick="go('ws','doc')">${ic('file',18)}근태 사유서 · 연차 신청하기</button>`;
}
function weekTitle(){ const s=new Date(TODAY); s.setDate(TODAY.getDate()-TODAY.getDay()+1+S.calOff*7); const e=new Date(s); e.setDate(s.getDate()+4); return `${s.getMonth()+1}.${s.getDate()} – ${e.getMonth()+1}.${e.getDate()}`; }
function diffH(a,b){ const [h1,m1]=a.split(':').map(Number),[h2,m2]=b.split(':').map(Number); const t=(h2*60+m2)-(h1*60+m1)-60; return `${Math.floor(t/60)}시간 ${t%60}분`; }

/* ================= WS: 서류 ================= */
function vDoc(){
  const f = S.docFilter;
  const list = MY_DOCS.filter(d=>f==='전체'||d.status===f);
  const stCls = {대기:'wait', 승인:'ok', 반려:'no'};
  return `
  <div class="page-h"><div><h2>서류</h2><p>작성할 서류를 고르세요</p></div></div>
  <div class="doc-grid">
    ${DOC_TYPES.map(t=>`<button class="doc-tile" onclick="openDocForm('${t.id}')"><span class="doc-ic" style="color:${t.c};background:${t.bg}">${ic(t.ic,20,2)}</span><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}
  </div>
  <section class="card">
    <div class="card-h"><h3>내 결재 현황</h3><span class="t13 muted">대기 ${MY_DOCS.filter(d=>d.status==='대기').length}건</span></div>
    <div class="chips">${['전체','대기','승인','반려'].map(c=>`<button class="chip ${c===f?'on':''}" onclick="S.docFilter='${c}';render()">${c}</button>`).join('')}</div>
    ${list.length ? list.map(d=>{ const t=DOC_TYPES.find(x=>x.id===d.type); const i=MY_DOCS.indexOf(d);
      return `<button class="list-item" onclick="openDocDetail(${i})"><span class="doc-ic" style="color:${t.c};background:${t.bg}">${ic(t.ic,18,2)}</span>
        <span class="grow"><span class="t15 ellipsis" style="display:block">${esc(d.title)}</span><span class="t13 muted">${d.date} 제출</span></span>
        <span class="st ${stCls[d.status]}">${d.status}</span></button>`; }).join('') : '<div class="empty">서류가 없어요</div>'}
  </section>`;
}
function openDocForm(id){
  const t = DOC_TYPES.find(x=>x.id===id);
  const fields = t.fields.map(([n,l,type])=>{
    let input;
    if (type.startsWith('select:')) input = `<select name="${n}">${type.slice(7).split(',').map(o=>`<option>${o}</option>`).join('')}</select>`;
    else if (type==='textarea') input = `<textarea name="${n}" placeholder="내용을 입력하세요"></textarea>`;
    else if (type==='date') input = `<input type="date" name="${n}" value="${iso(TODAY)}">`;
    else if (type==='time') input = `<input type="time" name="${n}" value="${n==='from'?'18:00':'21:00'}">`;
    else if (type==='number') input = `<input type="number" name="${n}" inputmode="numeric" placeholder="0" ${n==='count'?'value="1"':''}>`;
    else input = `<input type="${type}" name="${n}">`;
    return `<div class="field"><label>${l}</label>${input}</div>`;
  }).join('');
  openSheet(t.name, `
    <form onsubmit="submitDoc(event,'${id}')">
      ${fields}
      <div class="field"><label>결재선</label></div>
      <div class="approval-line" style="margin-top:-8px">
        <span class="who">${avatar(ME.name)}<span>나</span><small>기안</small></span>
        ${approvers().map(a=>`<span class="arrow">${ic('chevR',18)}</span><span class="who">${avatar(a.name)}<span>${a.name}</span><small>${a.role}</small></span>`).join('') || '<span class="t13 muted" style="margin-left:6px">대표 전결로 바로 처리돼요</span>'}
      </div>
      <button class="btn" type="submit">결재 요청</button>
    </form>`);
}
function submitDoc(e, id){
  e.preventDefault();
  const t = DOC_TYPES.find(x=>x.id===id);
  const fd = new FormData(e.target);
  const dt = fd.get('date'); let sub = '';
  if (dt){ const d=new Date(dt); sub = ` · ${d.getMonth()+1}/${d.getDate()} (${DOW[d.getDay()]})`; }
  if (id==='exp' && fd.get('amount')) sub += ` ${Number(fd.get('amount')).toLocaleString('ko-KR')}원`;
  const name = id==='leave' ? fd.get('kind')+' 신청' : t.name;
  MY_DOCS.unshift({type:id, title:name+sub, date:`${pad(TODAY.getMonth()+1)}.${pad(TODAY.getDate())}`, status:approvers().length?'대기':'승인'});
  closeSheet(); S.docFilter='전체'; render(); toast('결재를 요청했어요');
}
function openDocDetail(i){
  const d = MY_DOCS[i];
  const steps = approvers().map((a,k)=>{
    let cls = '', msg = '이전 단계 대기 중';
    if (d.status==='승인'){ cls = 'done'; msg = '승인 완료'; }
    else if (d.status==='반려'){ if (k===0){ cls = 'rej'; msg = '반려 · '+esc(d.note||''); } else msg = '진행 안 됨'; }
    else if (k===0){ cls = 'now'; msg = '검토 중이에요'; }
    return `<div class="tl ${cls}"><i></i><b>${a.role} · ${a.name}</b><p>${msg}</p></div>`;
  }).join('') || '<div class="tl done"><i></i><b>대표 전결</b><p>바로 처리됐어요</p></div>';
  openSheet('결재 상세', `
    <p class="t15" style="font-weight:700;font-size:17px">${esc(d.title)}</p>
    <p class="t13 muted" style="margin:4px 0 20px">${d.date} 제출</p>
    <div class="timeline">
      <div class="tl done"><i></i><b>기안 · ${ME.name}</b><p>${d.date} 제출 완료</p></div>
      ${steps}
    </div>
    <div style="margin-top:24px">${d.status==='대기'?`<button class="btn ghost" onclick="cancelDoc(${i})">요청 취소</button>`:d.status==='반려'?`<button class="btn" onclick="closeSheet();openDocForm('${d.type}')">다시 작성하기</button>`:''}</div>`);
}
function cancelDoc(i){ MY_DOCS.splice(i,1); closeSheet(); render(); toast('요청을 취소했어요'); }

/* ================= WS: 내 정보 ================= */
function payCalc(p){
  const r10 = n => Math.floor(n/10)*10;
  const nps=r10(p.base*0.045), hi=r10(p.base*0.03545), ltc=r10(hi*0.1295), ei=r10((p.base+p.ot)*0.009);
  const tax=r10((p.base+p.ot)*0.026), local=r10(tax*0.1);
  const gross = p.base+p.meal+p.ot;
  const ins = nps+hi+ltc+ei;
  const ded = ins+tax+local+p.late;
  return {gross, nps, hi, ltc, ei, ins, tax, local, ded, net:gross-ded};
}
function vMe(){
  const p = PAYS[S.payIdx], c = payCalc(p);
  return `
  <section class="card"><div class="profile">${avatar(ME.name)}<div><b>${ME.name}</b><p>${ME.dept} · ${ME.pos} · ${ME.no}</p></div></div></section>
  <section class="card" style="padding-top:12px;padding-bottom:6px">
    <button class="menu-row" onclick="openContract()"><span class="doc-ic" style="color:var(--primary);background:var(--primary-soft)">${ic('file',18,2)}</span><span class="grow">내 계약서 확인하기</span>${ic('chevR',18)}</button>
    <button class="menu-row" onclick="openHR()"><span class="doc-ic" style="color:var(--leave);background:var(--leave-soft)">${ic('user',18,2)}</span><span class="grow">인사 정보</span>${ic('chevR',18)}</button>
  </section>
  <section class="card">
    <div class="card-h"><h3>급여 명세</h3></div>
    <div class="chips">${PAYS.map((x,i)=>`<button class="chip ${i===S.payIdx?'on':''}" onclick="S.payIdx=${i};render()">${x.m}</button>`).join('')}</div>
    <p class="t13 muted">${p.m} 실수령액</p>
    <div class="pay-big">${won(c.net)}</div>
    <p class="t13 muted">지급 ${won(c.gross)} − 공제 ${won(c.ded)}</p>
    <div class="pay-sec"><h4><span>지급</span><span>${won(c.gross)}</span></h4>
      <div class="pay-line"><span>기본급</span><b>${won(p.base)}</b></div>
      <div class="pay-line"><span>식대 (비과세)</span><b>${won(p.meal)}</b></div>
      ${p.ot?`<div class="pay-line"><span>연장근무 수당</span><b>${won(p.ot)}</b></div>`:''}
    </div>
    <div class="pay-sec"><h4><span>공제</span><span>${won(c.ded)}</span></h4>
      <div class="pay-line minus"><span>국민연금</span><b>−${won(c.nps)}</b></div>
      <div class="pay-line minus"><span>건강보험</span><b>−${won(c.hi)}</b></div>
      <div class="pay-line minus"><span>장기요양보험</span><b>−${won(c.ltc)}</b></div>
      <div class="pay-line minus"><span>고용보험</span><b>−${won(c.ei)}</b></div>
      <div class="pay-line minus"><span>소득세 · 지방소득세</span><b>−${won(c.tax+c.local)}</b></div>
      <div class="pay-line minus"><span>근태 차감 (지각·결근)</span><b>${p.late?'−'+won(p.late):'0원'}</b></div>
    </div>
  </section>`;
}
function openContract(){
  openSheet('근로계약서', `
    <div class="kv"><span>계약 형태</span><b>정규직</b></div>
    <div class="kv"><span>계약 시작일</span><b>${ME.join}</b></div>
    <div class="kv"><span>소속 · 직급</span><b>${ME.dept} · ${ME.pos}</b></div>
    <div class="kv"><span>근무 시간</span><b>09:00 – 18:00 (휴게 1시간)</b></div>

}
function openHR(){

/* ================= CM: 게시판 ================= */
function vBoard(){
  const cats = ['전체','자유','질문','맛집','건의'];
  const list = POSTS.filter(p=>S.boardCat==='전체'||p.cat===S.boardCat);
  return `
  <div class="page-h"><div><h2>게시판</h2><p>모든 글은 익명으로 올라가요</p></div></div>
  <div class="chips">${cats.map(c=>`<button class="chip ${c===S.boardCat?'on':''}" onclick="S.boardCat='${c}';render()">${c}</button>`).join('')}</div>
  <section class="card">
    ${list.length ? list.map(p=>`
      <button class="post" onclick="openPost(${p.id})">
        <span class="tag">${p.cat}</span>
        <h4>${esc(p.title)}</h4>
        <p class="ellipsis">${esc(p.body)}</p>
        <div class="meta"><span>익명 · ${p.time}</span><span class="lk ${p.likes>=20?'hot':''}">${ic('heart',13,2.2)}${p.likes}</span><span class="lk">${ic('comment',13,2.2)}${p.comments.length}</span></div>
      </button>`).join('') : '<div class="empty">아직 글이 없어요</div>'}
  </section>`;
}
function openPost(id){
  const p = POSTS.find(x=>x.id===id);
  openSheet(p.cat+' 게시판', `
    <div class="row" style="margin-bottom:12px">${avatar('익')}<div><b class="t15">익명</b><p class="t13 muted">${p.time}</p></div></div>
    <h3 style="font-size:19px;font-weight:800;margin-bottom:8px">${esc(p.title)}</h3>
    <p style="font-size:15px;line-height:1.6;color:var(--ink-2)">${esc(p.body)}</p>
    <button class="like-btn ${p.liked?'on':''}" onclick="toggleLike(${id})">${ic('heart',16,2.2)}공감 ${p.likes}</button>
    <div class="t13" style="font-weight:700;margin-bottom:4px">댓글 ${p.comments.length}</div>
    ${p.comments.map(c=>`<div class="comment"><b>${esc(c.n)}</b><p>${esc(c.x)}</p></div>`).join('') || '<div class="empty">첫 댓글을 남겨보세요</div>'}
    <form class="composer" style="margin:12px -20px -24px;border-top:1px solid var(--line)" onsubmit="addComment(event,${id})">
      <input name="c" placeholder="익명으로 댓글 달기" autocomplete="off"><button type="submit">${ic('send',18,2)}</button>
    </form>`);
}
function toggleLike(id){ const p=POSTS.find(x=>x.id===id); p.liked=!p.liked; p.likes+=p.liked?1:-1; openPost(id); render(); }
function addComment(e,id){ e.preventDefault(); const v=e.target.c.value.trim(); if(!v) return; const p=POSTS.find(x=>x.id===id); p.comments.push({n:'익명'+(p.comments.length+1),x:v}); openPost(id); render(); }
function openWrite(){
  openSheet('글쓰기', `
    <form onsubmit="submitPost(event)">
      <div class="field"><label>카테고리</label><select name="cat"><option>자유</option><option>질문</option><option>맛집</option><option>건의</option></select></div>
      <div class="field"><label>제목</label><input name="title" required placeholder="제목을 입력하세요"></div>
      <div class="field"><label>내용</label><textarea name="body" required placeholder="익명으로 올라가요" style="height:140px"></textarea></div>
      <button class="btn" type="submit">올리기</button>
    </form>`);
}
function submitPost(e){ e.preventDefault(); const f=new FormData(e.target); POSTS.unshift({id:Date.now(),cat:f.get('cat'),title:f.get('title'),body:f.get('body'),time:'방금',likes:0,liked:false,comments:[]}); closeSheet(); S.boardCat='전체'; render(); toast('글을 올렸어요'); }

/* ================= CM: 메신저 / DM ================= */
function vChan(){
  return `
  <div class="page-h"><div><h2>채널</h2><p>참여 중인 채널 ${CHANNELS.length}개</p></div></div>
  <section class="card">
    ${CHANNELS.map(c=>{ const l=c.msgs[c.msgs.length-1]; return `
      <button class="list-item" onclick="openChat('chan','${c.id}')">
        <span class="chan-ic">${ic('hash',20,2)}</span>
        <span class="grow"><span class="t15" style="display:block">${c.name}</span><span class="t13 muted ellipsis" style="display:block">${l.who}: ${esc(l.x)}</span></span>
        ${c.unread?`<span class="count">${c.unread}</span>`:`<span class="t13 muted">${l.t}</span>`}
      </button>`; }).join('')}
  </section>`;
}
function vDm(){
  return `
  <div class="page-h"><div><h2>DM</h2><p>1:1 대화</p></div><button class="new-dm" onclick="openNewDm()">${ic('pen',16,2.2)}새 대화</button></div>
  <section class="card">
    ${DMS.filter(d=>d.id!==ME.id).map(d=>{ const l=d.msgs[d.msgs.length-1]; return `
      <button class="list-item" onclick="openChat('dm','${d.id}')">
        ${avatar(d.name, d.on?'on':'')}
        <span class="grow"><span class="t15" style="display:block">${d.name} <span class="t13 muted" style="font-weight:500">${d.role}</span></span><span class="t13 muted ellipsis" style="display:block">${esc(l.x)}</span></span>
        ${d.unread?`<span class="count">${d.unread}</span>`:`<span class="t13 muted">${l.t}</span>`}
      </button>`; }).join('')}
  </section>`;
}
function openChat(kind, id){ S.chat={kind,id}; const c=(kind==='chan'?CHANNELS:DMS).find(x=>x.id===id); c.unread=0; render(); }
function vChat(){
  const {kind,id} = S.chat;
  const c = (kind==='chan'?CHANNELS:DMS).find(x=>x.id===id);
  const head = kind==='chan'
    ? `<span class="chan-ic" style="width:34px;height:34px">${ic('hash',18,2)}</span><div><b>${c.name}</b><small>${c.desc}</small></div>`
    : `${avatar(c.name, c.on?'on':'')}<div><b>${c.name}</b><small>${c.on?'접속 중':'오프라인'} · ${c.role}</small></div>`;
  const msgs = c.msgs.map(m=>{
    const mine = kind==='dm' ? m.me : m.who===ME.name;
    const who = kind==='dm' ? c.name : m.who;
    return mine
      ? `<div class="msg me"><div class="bubble-row"><div class="bubble">${esc(m.x)}</div><span class="time">${m.t}</span></div></div>`
      : `<div class="msg">${avatar(who)}<div><div class="name">${esc(who)}</div><div class="bubble-row"><div class="bubble">${esc(m.x)}</div><span class="time">${m.t}</span></div></div></div>`;
  }).join('');
  return `
    <div class="chat-h"><button class="icon-btn" onclick="S.chat=null;render()" aria-label="뒤로">${ic('back',24,2)}</button><div class="row" style="gap:10px">${head}</div></div>
    <div class="msgs"><span class="day-div">${md(TODAY)}</span>${msgs}</div>
    <form class="composer" onsubmit="sendMsg(event)"><input name="m" placeholder="메시지 입력" autocomplete="off"><button type="submit" aria-label="보내기">${ic('send',18,2)}</button></form>`;
}
function sendMsg(e){
  e.preventDefault();
  const v = e.target.m.value.trim(); if(!v) return;
  const {kind,id} = S.chat; const c=(kind==='chan'?CHANNELS:DMS).find(x=>x.id===id);
  c.msgs.push(kind==='dm' ? {me:true,x:v,t:hhmm()} : {who:ME.name,x:v,t:hhmm()});
  render(); $('.composer input').focus();
}

/* ================= 시트 · 알림 · QR ================= */
let qrTimer = null;
function openSheet(title, html){ $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html; $('#sheet').hidden = false; }
function closeSheet(){ $('#sheet').hidden = true; clearInterval(qrTimer); }
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; $('#app').appendChild(t); setTimeout(()=>t.remove(),1800); }
function openNotice(id){
  const n = NOTICES.find(x=>x.id===id);
  if (!n.read.includes(ME.id)) n.read.push(ME.id);
  const staff = MEMBERS.filter(m=>m.role!=='대표');
  const yet = staff.filter(m=>!(n.ok||[]).includes(m.id));
  openSheet('공지', `
    <span class="tag ${n.cat==='필독'?'danger':'primary'}">${n.cat}</span>
    <h3 style="font-size:19px;font-weight:800;margin:8px 0 4px">${esc(n.title)}</h3>
    <p class="t13 muted" style="margin-bottom:16px">윤석현 · 대표 · ${n.date}</p>
    <p style="font-size:15px;line-height:1.65;color:var(--ink-2)">${esc(n.body)}</p>
    ${!n.must ? '' : needConfirm(n)
      ? `<div style="margin-top:22px"><button class="btn" onclick="confirmNotice(${id})">${ic('check',20,2.4)}확인했어요</button></div>`
      : `<div class="confirm-box">${ic('check',16,2.6)} ${n.ok.length}/${staff.length}명 확인
          <p>${yet.length ? `아직 확인 안 함: ${yet.map(m=>m.name).join(', ')}` : '전원 확인했어요'}</p></div>`}`);
  render();
}
function openNoti(){
  openSheet('알림', NOTI.map(n=>`<div class="noti ${n.unread?'unread':''}"><span class="doc-ic" style="color:${n.c};background:var(--surface-2)">${ic(n.ic,18,2)}</span><div style="flex:1"><b>${n.title}</b><p>${n.body} · ${n.time}</p></div></div>`).join(''));
  NOTI.forEach(n=>n.unread=false); render();
}
function qrSvg(){
  const N=25; let r='';
  const inF = (x,y) => (x<8&&y<8)||(x>=N-8&&y<8)||(x<8&&y>=N-8);
  for (let y=0;y<N;y++) for (let x=0;x<N;x++) if(!inF(x,y) && Math.random()<.47) r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;
  const fin = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" width="196" height="196" shape-rendering="crispEdges" fill="#191f28">${r}${fin(0,0)}${fin(N-7,0)}${fin(0,N-7)}</svg>`;
}
function openQR(){
  const out = !!S.checkIn;
  openSheet(out?'퇴근 QR':'출근 QR', `
    <div class="qr-box">
      <div class="qr-frame" id="qrImg">${qrSvg()}</div>
      <p class="qr-timer"><b id="qrSec">30</b>초 후 새 QR로 바뀌어요</p>
      <p class="t13 muted" style="text-align:center">회사 출입구 단말기에 QR을 보여주세요</p>
    </div>
    <button class="btn" onclick="doCheck()">${ic('check',20,2.4)}${out?'퇴근':'출근'} 처리 (데모)</button>`);
  let s = 30; clearInterval(qrTimer);
  qrTimer = setInterval(()=>{ s--; if(s<=0){ s=30; $('#qrImg').innerHTML=qrSvg(); } const el=$('#qrSec'); if(el) el.textContent=s; },1000);
}
function doCheck(){
  if (!S.checkIn){ S.checkIn = hhmm(); toast(`${S.checkIn} 출근했어요`); }
  else { S.checkOut = hhmm(); toast(`${S.checkOut} 퇴근했어요. 수고하셨어요!`); }
  closeSheet(); render();
}

render();
</script>
