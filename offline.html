<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연결 끊김</title>
<style>
  :root { --bg: #f5f6f8; --fg: #1a1d23; --muted: #6b7280; --primary: #2f5bea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111318; --fg: #e8eaef; --muted: #9aa1ad; --primary: #6d8cff; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center; text-align: center;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    padding: 24px calc(16px + env(safe-area-inset-right)) 24px calc(16px + env(safe-area-inset-left));
  }
  h1 { font-size: 20px; margin: 12px 0 6px; }
  p { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: var(--primary);
    border: 0; border-radius: 12px; padding: 12px 24px; min-height: 44px; cursor: pointer;
  }
  .ic { font-size: 40px; }
</style>
</head>
<body>
  <div>
    <div class="ic" aria-hidden="true">📶</div>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>연결 상태를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </div>
</body>
</html>
